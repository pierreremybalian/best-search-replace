# Throwaway single-site WordPress for developing and testing Best Search Replace.
#
#   cd dev && ./bootstrap.sh              # install + seed fixtures
#   cd dev && ./bootstrap.sh --reset      # wipe volumes first
#
# Browse: http://besr.localhost:8081/wp-admin  (admin / admin)
# PHP runs with max_execution_time=5 on purpose, to prove the chunked engine.
# Port 8080 belongs to the multisite-cloner rig; this one uses 8081.

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
    volumes:
      - besr_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISALLOW_FILE_EDIT', true );
    volumes:
      - besr_wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/best-search-replace
      - ./php-besr.ini:/usr/local/etc/php/conf.d/zz-besr.ini:ro

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - besr_wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/best-search-replace
      - ./fixtures:/fixtures:ro
      - ./tests:/tests:ro
      - ./php-besr.ini:/usr/local/etc/php/conf.d/zz-besr.ini:ro
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  besr_db:
  besr_wp:
